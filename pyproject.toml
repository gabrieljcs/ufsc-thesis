[project]
name = "thesis-eval"
version = "0.0.1"
description = "Cross-lingual jailbreak evaluation of language-specific LLMs"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_eval"]
